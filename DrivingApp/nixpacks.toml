# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.curl",
    "php83Extensions.zip",
    "php83Extensions.bcmath",
    "php83Extensions.gd",
    "php83Extensions.tokenizer",
    "php83Extensions.dom",
    "php83Extensions.fileinfo",
    "nodejs_20"
]

[phases.build]
cmds = [
    "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public",
    "chmod -R 775 storage bootstrap/cache",
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --force && php artisan app:seed-once && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
